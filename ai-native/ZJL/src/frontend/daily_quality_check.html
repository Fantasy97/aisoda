<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日质检触发器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --apple-blue: #0071e3;
      --apple-blue-hover: #0077ed;
      --apple-bg: #f5f5f7;
      --apple-card: #ffffff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--apple-bg);
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.6);
      width: 100%;
      max-width: 640px;
      padding: 24px;
    }
    .btn {
      background: var(--apple-blue);
      color: white;
      border-radius: 999px;
      transition: all 0.2s ease;
    }
    .btn:hover { background: var(--apple-blue-hover); }
    .btn:active { transform: scale(0.98); }
    .input {
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      padding: 10px 14px;
      width: 100%;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .input:focus {
      outline: none;
      border-color: var(--apple-blue);
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
    }
    .pill {
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      background: #f2f2f7;
    }
    pre {
      background: #0b1220;
      color: #d1e3ff;
      border-radius: 12px;
      padding: 14px;
      overflow-x: auto;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card space-y-6">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">
        <i class="fa-solid fa-rocket"></i>
      </div>
      <div>
        <div class="text-lg font-semibold">每日质检触发器</div>
        <div class="text-sm text-gray-500">调用 /api/daily-quality-check</div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="text-xs text-gray-500 mb-1 block">日期 (YYYY-MM-DD，不填默认昨天)</label>
        <input id="dateInput" class="input" type="date" />
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">API 地址</label>
        <input id="apiBase" class="input" type="text" value="http://localhost:5009" />
      </div>
    </div>

    <div class="flex items-center space-x-3">
      <label class="inline-flex items-center space-x-2">
        <input id="exportExcel" type="checkbox" class="h-4 w-4 text-blue-600" checked />
        <span class="text-sm text-gray-700">导出 Excel</span>
      </label>
      <label class="inline-flex items-center space-x-2">
        <input id="skipDup" type="checkbox" class="h-4 w-4 text-blue-600" checked />
        <span class="text-sm text-gray-700">跳过重复</span>
      </label>
      <span class="pill text-gray-500">测试模式默认 API 内部已限制 10 条</span>
    </div>

    <button id="runBtn" class="btn w-full py-3 text-sm font-medium shadow-lg shadow-blue-500/20">
      发起质检
    </button>

    <div id="status" class="text-sm text-gray-500"></div>

    <div>
      <div class="text-xs text-gray-500 mb-2">响应结果</div>
      <pre id="responseBox">{ }</pre>
    </div>
  </div>

  <script>
    const btn = document.getElementById('runBtn');
    const statusEl = document.getElementById('status');
    const respBox = document.getElementById('responseBox');

    function setStatus(text, ok = true) {
      statusEl.textContent = text;
      statusEl.className = ok ? "text-sm text-green-600" : "text-sm text-red-600";
    }

    btn.addEventListener('click', async () => {
      const base = document.getElementById('apiBase').value.trim().replace(/\/$/, '');
      const dateVal = document.getElementById('dateInput').value;
      const exportExcel = document.getElementById('exportExcel').checked;
      const skipDup = document.getElementById('skipDup').checked;

      const payload = {
        date: dateVal || null,
        export_excel: exportExcel,
        skip_duplicates: skipDup,
      };

      const url = `${base}/api/daily-quality-check`;
      setStatus('请求中...', true);
      respBox.textContent = '{ }';

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const contentType = res.headers.get('Content-Type') || '';
        if (contentType.includes('application/json')) {
          const data = await res.json();
          respBox.textContent = JSON.stringify(data, null, 2);
          if (res.ok && data.success) {
            setStatus('成功完成请求', true);
          } else {
            setStatus(`请求失败: ${data.error || res.status}`, false);
          }
        } else {
          // 处理文件下载
          const blob = await res.blob();
          const fileName = `质检结果_${dateVal || 'yesterday'}.xlsx`;
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = fileName;
          link.click();
          URL.revokeObjectURL(link.href);
          respBox.textContent = '已收到 Excel 文件并触发下载。';
          setStatus('成功完成请求（Excel 已下载）', true);
        }
      } catch (err) {
        setStatus(`请求异常: ${err.message}`, false);
        respBox.textContent = err.stack || err.message;
      }
    });
  </script>
</body>
</html>
