<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌宠Demo - 功能展示</title>
    <link rel="stylesheet" href="desktop-pet-demo.css">
</head>
<body>
    <div class="container">
        <!-- 头部区域 -->
        <header class="header">
            <div class="pet-icon">🤖</div>
            <h1 class="title">桌宠Demo</h1>
            <p class="subtitle">体验智能桌宠的4大核心功能</p>
        </header>

        <!-- 功能卡片区域 -->
        <div class="features-grid" id="featuresGrid">
            <!-- 功能1: 帮我联系 -->
            <div class="feature-card" data-feature="contact">
                <div class="card-icon">💬</div>
                <h2 class="card-title">帮我联系</h2>
                <p class="card-description">新建群组，快速联系团队成员</p>
                <div class="card-badge">群组管理</div>
                <div class="card-hover-effect"></div>
            </div>

            <!-- 功能2: 给我总结 -->
            <div class="feature-card" data-feature="summary">
                <div class="card-icon">📋</div>
                <h2 class="card-title">给我总结</h2>
                <p class="card-description">拖拽桌宠图标，获取内容总结</p>
                <div class="card-badge">拖拽交互</div>
                <div class="card-hover-effect"></div>
            </div>

            <!-- 功能3: 教我做事 -->
            <div class="feature-card" data-feature="guide">
                <div class="card-icon">🎓</div>
                <h2 class="card-title">教我做事</h2>
                <p class="card-description">语音互动，获取操作说明文档</p>
                <div class="card-badge">语音交互</div>
                <div class="card-hover-effect"></div>
            </div>

            <!-- 功能4: 替我干活 -->
            <div class="feature-card" data-feature="work">
                <div class="card-icon">⚡</div>
                <h2 class="card-title">替我干活</h2>
                <p class="card-description">自动操作，变换指针执行任务</p>
                <div class="card-badge">自动执行</div>
                <div class="card-hover-effect"></div>
            </div>
        </div>

        <!-- 底部说明 -->
        <footer class="footer">
            <p>点击上方卡片体验对应功能</p>
        </footer>
    </div>

    <script src="desktop-pet-demo.js"></script>
</body>
</html>
